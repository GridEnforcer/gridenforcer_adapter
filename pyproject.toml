[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridenforcer-adapter"
version = "0.1.2"
description = "Shared adapter base classes for Home Assistant energy management integrations"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "GridEnforcer", email = "noreply@gridenforcer.org"},
]
keywords = ["home-assistant", "energy", "adapter", "integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/GridEnforcer/gridenforcer_adapter"
Repository = "https://github.com/GridEnforcer/gridenforcer_adapter"
Issues = "https://github.com/GridEnforcer/gridenforcer_adapter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gridenforcer_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
