name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install deps
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: pytest
        run: uv run pytest tests/ -q

      - name: ruff
        run: uv run ruff check src/
